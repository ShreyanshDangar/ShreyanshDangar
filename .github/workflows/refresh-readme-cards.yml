name: Refresh README Cards

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: write

jobs:
  refresh:
    name: Refresh Repo-Hosted Stats Cards
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update SVG cards
        run: ./scripts/update-readme-cards.sh

      - name: Commit refreshed cards
        run: |
          if git diff --quiet -- assets/readme-cards; then
            echo "No card changes detected."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/readme-cards
          git commit -m "chore: refresh README cards"
          git push
